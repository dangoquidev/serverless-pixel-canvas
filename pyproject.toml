[project]
name = "serverless-pixel-canvas"
version = "0.1.0"
description = "Serverless Pixel Canvas Backend Services"
readme = "DOC.md"
requires-python = ">=3.12"

# These are the production dependencies required by your Lambda functions
dependencies = [
    "boto3>=1.34.0",
    "pillow>=10.2.0",
    "PyNaCl>=1.5.0",
    "PyJWT>=2.8.0",
    "aws-lambda-powertools>=3.25.0",
]

# These are only installed locally for development and testing
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-env>=1.1.0",
    "moto>=5.0.0"
]

# We can move the pytest configuration directly into here!
# This replaces the need for the separate pytest.ini file.
[tool.pytest.ini_options]
env = [
    "AWS_XRAY_CONTEXT_MISSING=LOG_ERROR",
    "POWERTOOLS_TRACE_DISABLED=1",
    "POWERTOOLS_SERVICE_NAME=test",
]
pythonpath = ["."]
testpaths = ["tests"]
